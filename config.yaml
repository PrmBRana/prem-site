  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/prem.png"
    content: |-
      I am a Satellite Research Fellow with a deep passion for web development and technology-art integration. With a background in Electronics and Communication Engineering, I am fascinated by how creativity and engineering can come together to build innovative solutions for space and society.

      Currently, I am working on RISC-V (ASIC) development at Antarikchya Pratisthan Nepal (APN) in Lazimpat, Kathmandu.

      I am also involved in the Slippers2Sat (S2S) project — an innovative CubeSat initiative led by APN with funding from Amateur Radio Digital Communications (ARDC). The mission aims to advance space technology while empowering marginalized and indigenous communities in Nepal.
      S2S provides training and scholarships for middle school students (grades 7 and 8) from Chepang, Tamang, and Dalit communities, giving them hands-on experience in satellite design and development.
    skills:
      enable: true
      title: "Here are a few technologies I've been working with recently:"
      items:
        - "Embedded C Programming"
        - "Nuttx"
        - "C-Programming"
        - "RISC-V (Verilog)"
        - "Python"
        - "Detection Sesmio-Electromanetic wave from Space"

