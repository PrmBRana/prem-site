      - title: Slippers2Sat
        content: |-
          Nepal's First Middle School Nano-Satellite Project — Slippers2Sat (S2S).********
          Slippers2Sat (S2S) is a 1U CubeSat project by Antarikchya Pratisthan Nepal (APN) with support from Amateur Radio Digital Communications (ARDC). Developed by six APN engineers, the project trains students at the Space System Laboratory (SSL) in Navodaya School through hands-on satellite development. S2S aims to educate indigenous, marginalized, and backward middle school students (grades 7–8) via scholarships, combining formal education with satellite training. In early 2024, the APN team conducted an Amateur Radio and Satellite Bootcamp in Lamjung, Makawanpur, and Chitwan, selecting 10 students from Chepang, Tamang, and Dalit communities to participate.
        image: /images/s2s_logo.png
        
      - title: "RISC-V Processor Design and Simulation"
        content: |
          Designed and simulated a custom **RISC-V processor architecture** using Verilog HDL.  
          Implemented both **single-cycle** and **five-stage pipelined** processor models to explore performance differences and instruction throughput.  
          Integrated **UART**, **GPIO** and **SPI** communication interfaces and tested them through behavioral and timing simulations.  
          Developed and verified the system using **ModelSim**, **Verilator**, and **cocotb testbenches**, ensuring proper hazard handling and instruction forwarding.

        image: /images/RISC.jpeg

        featured:
          name: "Repository"
          link: "https://github.com/premrana/RISC-V-Processor"

