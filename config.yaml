        companyUrl: "/projects/yolo-fruit-detection/"
        jobs:
          - name: "Recognition and Separation of Fresh and Rotten Fruits using YOLO Algorithm"
            date: "2023"
            content: |
              Developed a computer vision system that detects and classifies fruits as **fresh or rotten** using the **YOLOv5 deep learning algorithm**.  
              The project utilized **Python**, **OpenCV**, and **PyTorch**, achieving over **90% accuracy** on test data.  
        
              <img src="/images/fruit-detection-sample.jpg" alt="YOLO Fruit Detection Project" style="width:100%; border-radius:10px; margin-top:10px;">

              🔗 **[View full project and results on ResearchGate](https://www.researchgate.net/publication/379986263_Recognition_and_separation_of_fresh_and_rotten_fruits_using_YOLO_algorithm/citations)**  
              🔗 **[View full project and results on ResearchGate](researchgate.net/publication/392031828_Comparative_Study_of_Object_Detection_Models_for_Fresh_and_Rotten_Apples_and_Tomatoes_Faster_R-CNN_DETR_YOLOv8_and_YOLOv12S?_sg%5B0%5D=9pl6sa9xYxlmk6TxXzAvsBzFBftT9ScRTIi16Lw9XT5qQIgXB0lU2qe4lZ1nlts5bBPaqLSMfFFlv9Fd-hjDaTI-7Y_lMJovzjKf_6et.sma6gIsq2xxyYZ6GyQKmteaWLC923XWyRapF1ZrIfKez7McttIzokYn1T6I3Wv2_X6aYDvNJtSGjSRVlIL9Dvg&_tp=eyJjb250ZXh0Ijp7ImZpcnN0UGFnZSI6InByb2ZpbGUiLCJwYWdlIjoicHJvZmlsZSIsInBvc2l0aW9uIjoicGFnZUNvbnRlbnQifX0)** 
              💻 **[GitHub Repository](https://github.com/PrmBRana/Rotten_And_Fresh_Fruits_Detection_And_Separation)**
            info:
              content: Deep Learning / Computer Vision Project


      - company: "Dharan Satellite Bootcamp  "
        companyUrl: "/projects/dharan-bootcamp/"
        jobs:
          - name: "STEM & Satellite Training Program for Class 7–10 Students"
            date: "4 Days Bootcamp – 2024"
            info:
              content: "STEM Outreach / Space Technology Education"
            content: |
              Conducted a **4-day Satellite Bootcamp** in **Dharan**, training students of grades **7, 8, 9, and 10** on space technology and hands-on satellite design.

                - **Day   1:** Basics of Electronics — understanding resistors, capacitors, transistors, and circuits.  
                - **Day 2:** Practical soldering, hardware assembly, and introduction to **CubeSat structure** and subsystems (*Payload, OBC, EPS, Power System, and Mission overview*).  
                - **Day 3:** Programming microcontrollers and interfacing with various sensors for satellite data acquisition.  
                - **Day 4:** Simulated satellite **deployment using a parachute**, wireless data transmission, and recovery operations.

                📷 **[View Photos](/projects/dharan-bootcamp/)**  
                
