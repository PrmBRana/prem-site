      - company: "Quad-Mag Technology"
        companyUrl: "/projects/epdm/"
        jobs:
          - name: "Earthquake Precursor Detection Mission (EPDM)"
            date: "Jan 2020 - Aug 2020"
            info:
              content: "Space Technology Education"
            content: |
              The Earthquake Precursor Detection Mission (EPDM) is designed to use a Quad-Mag technology payload, consisting of four PNI
              RM3100 magnetometers, to detect and analyze electromagnetic signals in the Ultra-Low Frequency (ULF: below 3 Hz) and
              Extremely Low Frequency (ELF: 3 Hz to 3 kHz) ranges, which are generated from the Earth's surface before an earthquake. Unlike
              traditional satellites that rely on long telescopic or deployable booms to protect magnetometers from stray magnetic fields caused by
              internal electric subsystems, the EPDM employs Quad-Mag technology and the Undetermined Blind Source Separation (UBSS)
              algorithm, both tested in the University of Michigan lab to remove interference or stray magnetic field and accurately measure the
              Earth’s magnetic field. The PNI RM3100 magnetometers, proven suitable for CubeSat missions, operate with high efficiency and
              are capable of functioning in space environments. The primary objective of the mission is to demonstrate the capability of
              space-based technologies to separate stray magnetic fields from ambient magnetic fields for detecting earthquake precursor signals
              without using any mechanical boom. 
