      - title: "Detection and Separation of Rotten and Fresh Fruits using YOLO Algorithm"
        content: |
          Developed an **AI-based fresh and ritten fruit detection and sorting system** using the **YOLO (You Only Look Once)** object detection algorithm.  
          The model identifies and separates **fresh** and **rotten fruits** in real time using a custom image dataset.  
          Implemented the system on a **conveyor-belt mechanism**, driven by a **stepper motor**, to automate the sorting process.  
          Used **two web cameras** for multi-angle fruit inspection and a **Raspberry Pi** (or computer) for on-board image processing and motor control.  
          Trained and optimized YOLO for high accuracy across multiple fruit types, improving speed and precision in agricultural and industrial applications.  
          Integrated the trained model with a **web-based dashboard** for live monitoring, visualization, and automatic labeling.
