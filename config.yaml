    image: "/images/prem.png"
    content: |-
      I am a Satellite Research Fellow with a strong passion for RISC-V and AI. With a background in Electronics and Communication Engineering, I am fascinated by how creativity and engineering can come together to develop innovative solutions for space and society. 
      
      Currently, I am working on RISC-V (ASIC) development at Antarikchya Pratisthan Nepal (APN) in Lazimpat, Kathmandu. I am also involved in the Slippers2Sat (S2S) project — an innovative CubeSat initiative led by APN and funded by Amateur Radio Digital Communications (ARDC). 
      This mission not only advances space technology but also empowers marginalized, indigenous, and backward communities in Nepal. Through S2S, middle school students (grades 7 and 8) from Chepang, Tamang, and Dalit communities receive training and scholarships, gaining hands-on experience in satellite design and development.
